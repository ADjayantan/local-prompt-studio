name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static frontend
        run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'
      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p pages-dist
          cp dist/client/index.html dist/client/index.rsc dist/client/favicon.svg pages-dist/
          cp pages-dist/index.html pages-dist/404.html
          cp -R "dist/client/${{ github.event.repository.name }}/_next" pages-dist/_next
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
